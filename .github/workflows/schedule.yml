name: Daily Dividend Check

on:
  schedule:
    - cron: '00 12 * * 1-5'  # 08:00 AM EDT
    - cron: '15 13 * * 1-5'  # 09:15 AM EDT
    - cron: '45 13 * * 1-5'  # 09:45 AM EDT
    - cron: '30 14 * * 1-5'  # 10:30 AM EDT
    - cron: '45 15 * * 1-5'  # 11:45 AM EDT
    - cron: '00 17 * * 1-5'  # 01:00 PM EDT
    - cron: '15 18 * * 1-5'  # 02:15 PM EDT
    - cron: '30 19 * * 1-5'  # 03:30 PM EDT
    - cron: '00 20 * * 1-5'  # 04:00 PM EDT
    - cron: '30 20 * * 1-5'  # 04:30 PM EDT
    - cron: '30 21 * * 1-5'  # 05:30 PM EDT
    - cron: '00 23 * * 1-5'  # 07:00 PM EDT
    - cron: '00 01 * * 2-6'  # 09:00 PM EDT
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Execute dividend script
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
